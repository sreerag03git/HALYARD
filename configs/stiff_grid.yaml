# HALYARD stiff-grid case — the HONEST NULL RESULT. A high-inertia (strong) grid produces a
# small frequency deviation, so little support is drawn, the rotor barely moves, and the
# control-driven hang-off fatigue is negligible. Phase-1 must FAIL here and the app must say
# "under these conditions the effect is negligible" without dressing it up as an error.
# This case is asserted by the test suite (tests/test_phase1_fail.py).
name: stiff_grid
description: >
  Strong, high-inertia (H=6 s) grid with a small loss of infeed and a rougher sea (Hs 2.5 m)
  that swamps the control motion. Phase-1 returns NEGLIGIBLE — a legitimate result, not a bug.

grid:
  H_sys_s: 6.0          # strong grid -> shallow, slow frequency deviation
  D_load: 1.5
  R_sys: 0.05
  T_gov_s: 8.0
  reserve_pu: 0.15
  T_rocof_s: 0.5
  S_base_MW: 20000.0    # large interconnected system

support:
  H_wt_s: 6.0
  R_droop: 0.05
  deadband_hz: 0.015
  dP_max: 0.10
  rate_pu_s: 0.50
  tau_s: 0.20

recovery:
  kind: shaped
  tau_rec_s: 12.0
  rate_rec_pu_s: 0.02

schedule:
  t_event_s: 100.0
  support_window_s: 10.0

sim:
  wind_ms: 9.0
  Hs_m: 2.5             # rougher sea swamps the control motion
  Tp_s: 8.0
  wave_seed: 1234
  t_end_s: 350.0
  dt_s: 0.025
  t_discard_s: 100.0
  p_load_pu: 0.05       # small event on a strong grid
  wind_capacity_MW: 900.0
  beta_deg: 0.0

cable:
  daf: 1.2
  hangoff_stick: true

fatigue:
  sn_curve: {m1: 3.0, log_a1: 11.764, m2: 5.0, log_a2: 15.606, N_knee: 1.0e6, sigma_u_MPa: 1400.0}
  mean_stress: goodman
  DFF: 3.0

annualization:
  events_per_year: 500.0
  sea_state_occurrence: 0.30

phase1_thresholds:
  added_damage_frac_min: 0.05
  recovery_share_min: 0.20
  min_slow_stress_amp_MPa: 0.5
  slow_cutoff_hz: 0.03
