name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==8.3.4
      - name: Run test suite (physics vs analytical/reference cases + Phase-1 FAIL branch)
        run: pytest -q
      - name: Smoke-test the Streamlit app (headless, no exceptions)
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file("streamlit_app.py", default_timeout=300).run()
          assert not at.exception, [str(e.value) for e in at.exception]
          print("app OK, tabs:", len(at.tabs))
          PY
