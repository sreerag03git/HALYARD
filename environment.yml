# Conda environment for local development of HALYARD.
# Streamlit Community Cloud uses requirements.txt (pip) — this file mirrors it for conda users.
name: halyard
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=2.1.3
  - scipy=1.14.1
  - pandas=2.2.3
  - pip
  - pip:
      - plotly==5.24.1
      - streamlit==1.39.0
      - rainflow==3.2.0
      - PyYAML==6.0.2
      - pytest==8.3.4
